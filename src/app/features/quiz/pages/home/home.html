<main class="home-page">
  <!-- Background -->
  <div class="home-page__background"></div>
  <div class="home-page__overlay"></div>

  <!-- Decorative elements -->
  <img
    class="home-page__leaf home-page__leaf--left"
    src="/assets/nature/leaves.webp"
    alt=""
    aria-hidden="true"
  />

  <img
    class="home-page__leaf home-page__leaf--right"
    src="/assets/nature/leaves.webp"
    alt=""
    aria-hidden="true"
  />

  <div class="home-page__glow home-page__glow--top"></div>
  <div class="home-page__glow home-page__glow--bottom"></div>

  <!-- Content -->
  <div class="home-page__content">

    <!-- Top bar -->
    <header class="home-header">
      <div class="home-header__brand">
        <span class="home-header__brand-icon">✦</span>

        <span class="home-header__brand-text">
          Aventura
        </span>
      </div>

      <div class="home-header__region">
        Mesoamérica
      </div>
    </header>

    <!-- Hero -->
    <section class="home-hero">

      <!-- Explorer -->
      <div class="explorer-wrapper">
        <div class="explorer-glow"></div>

        <div class="explorer-card">
          <img
            src="/assets/characters/welcome.webp"
            alt="Explorador de Aventura Mesoamérica"
            class="explorer-image"
          />
        </div>

        <img
          src="/assets/rewards/star.webp"
          alt=""
          aria-hidden="true"
          class="explorer-star explorer-star--one"
        />

        <img
          src="/assets/rewards/star.webp"
          alt=""
          aria-hidden="true"
          class="explorer-star explorer-star--two"
        />
      </div>

      <!-- Welcome badge -->
      <div class="welcome-badge">
        <span class="welcome-badge__dot"></span>
        <span>Una aventura por descubrir</span>
      </div>

      <!-- Title -->
      <h1 class="home-title">
        Aventura
        <span>Mesoamérica</span>
      </h1>

      <!-- Description -->
      <p class="home-description">
        Viaja al pasado y descubre las culturas,
        alimentos, ciudades y secretos de Mesoamérica.
      </p>

      <!-- Main action -->
      <a
        routerLink="/instrucciones"
        class="start-button"
      >
        <span class="start-button__text">
          Comenzar aventura
        </span>

        <span class="start-button__icon">
          →
        </span>
      </a>

      <!-- Secondary action -->
      <a
        routerLink="/instrucciones"
        class="instructions-link"
      >
        ¿Cómo se juega?
      </a>
    </section>

    <!-- Bottom -->
    <footer class="home-footer">
      <div class="home-footer__item">
        <span>✦</span>
        Aprende
      </div>

      <div class="home-footer__separator"></div>

      <div class="home-footer__item">
        <span>✦</span>
        Explora
      </div>

      <div class="home-footer__separator"></div>

      <div class="home-footer__item">
        <span>✦</span>
        Descubre
      </div>
    </footer>

  </div>
</main>
