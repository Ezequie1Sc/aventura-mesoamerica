<main class="result-page">
  <!-- Decorative background -->
  <div
    class="result-background"
    aria-hidden="true"
  ></div>

  <div
    class="result-overlay"
    aria-hidden="true"
  ></div>

  <!-- Decorative leaves -->
  <img
    class="result-leaf result-leaf--left"
    src="/assets/nature/leaves.webp"
    alt=""
    aria-hidden="true"
  />

  <img
    class="result-leaf result-leaf--right"
    src="/assets/nature/leaves.webp"
    alt=""
    aria-hidden="true"
  />

  <section class="result-content">
    <!-- Header -->
    <header class="result-header">
      <a
        routerLink="/"
        class="back-button"
        aria-label="Volver al inicio"
      >
        ←
      </a>

      <div class="result-header__title">
        <span>✦</span>

        <p>AVENTURA MESOAMÉRICA</p>

        <span>✦</span>
      </div>
    </header>

    <!-- Character -->
    <section class="result-character">
      <div class="result-character__glow"></div>

      <img
        class="result-character__image"
        [src]="getCharacterImage()"
        alt="Explorador celebrando"
      />
    </section>

    <!-- Result title -->
    <section class="result-heading">
      <span class="result-heading__star">
        ✦
      </span>

      <h1>
        {{ getResultTitle() }}
      </h1>

      <span class="result-heading__star">
        ✦
      </span>

      <p>
        {{ getResultMessage() }}
      </p>
    </section>

    <!-- Score -->
    <section class="score-card">
      <div class="score-card__stars">
        <span>★</span>
        <span>★</span>
        <span>★</span>
      </div>

      <div class="score-card__score">
        <strong>
          {{ score() }}
        </strong>

        <span>
          / {{ totalQuestions() }}
        </span>
      </div>

      <p>
        respuestas correctas
      </p>
    </section>

    <!-- Earned badge -->
    <section class="result-badge">
      <span class="result-badge__label">
        ✦ INSIGNIA OBTENIDA ✦
      </span>

      <div class="result-badge__image-wrapper">
        <div
          class="result-badge__glow"
          aria-hidden="true"
        ></div>

        <img
          class="result-badge__image"
          [src]="getBadgeImage()"
          [alt]="getBadge().name"
        />
      </div>

      <h2>
        {{ getBadge().name }}
      </h2>

      <p>
        {{ getBadge().description }}
      </p>
    </section>

    <!-- Actions -->
    <section class="result-actions">
      <a
        routerLink="/insignias"
        class="claim-button"
      >
        <span>✦</span>

        <span>
          Reclamar insignia
        </span>

        <span>→</span>
      </a>

      <button
        type="button"
        class="restart-button"
        (click)="restartQuiz()"
      >
        <span>↻</span>

        <span>
          Volver a jugar
        </span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="result-footer">
      <span>🌿</span>

      <p>
        ¡Sigue explorando y aprendiendo!
      </p>

      <span>🌿</span>
    </footer>
  </section>
</main>
